<svg xmlns="http://www.w3.org/2000/svg" width="720" height="608" viewBox="0 0 720 608" role="img" aria-labelledby="t d">
<title id="t">Median time per scenario, every version (jsdom, log scale)</title>
<desc id="d">Median time of 9 XSLT 1.0 scenarios on 1.1.3, 1.2.0, 1.3.0, xslt3 1.0.0; further left is faster.</desc>
<style>
svg{--surface:#ffffff;--text:#1f2937;--muted:#5f6368;--grid:#e8eaed;--axis:#bdc1c6;--new:#2a78d6;--old:#eb6834;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px}
@media (prefers-color-scheme:dark){svg{--surface:#202124;--text:#e8eaed;--muted:#9aa0a6;--grid:#3c4043;--axis:#5f6368;--new:#3987e5;--old:#d95926}}
.bg{fill:var(--surface)}.t1{fill:var(--text)}.t2{fill:var(--muted)}
.title{fill:var(--text);font-size:13px;font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.link{stroke:var(--axis);stroke-width:2}
.new{fill:var(--new)}.old{fill:var(--old)}
.ring{stroke:var(--surface);stroke-width:2}
svg{--v0:#b06000;--v1:#9334e6;--v2:#1a73e8;--v3:#188038}
@media (prefers-color-scheme:dark){svg{--v0:#fcad70;--v1:#c58af9;--v2:#8ab4f8;--v3:#81c995}}
.v0{fill:var(--v0)}.v1{fill:var(--v1)}.v2{fill:var(--v2)}.v3{fill:var(--v3)}
</style>
<rect class="bg" width="720" height="608" rx="8"/>
<text class="title" x="16" y="24">Median time per scenario, every version (jsdom, log scale)</text>
<circle class="v0 ring" cx="255" cy="46" r="5"></circle>
<text class="t1" x="265" y="50" text-anchor="start">1.1.3</text>
