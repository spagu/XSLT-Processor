<text class="t2" x="250" y="486" text-anchor="middle">10 ms</text>
<line class="grid" x1="383.3" x2="383.3" y1="78" y2="470"/>
<text class="t2" x="383.3" y="486" text-anchor="middle">100 ms</text>
<line class="grid" x1="516.7" x2="516.7" y1="78" y2="470"/>
<text class="t2" x="516.7" y="486" text-anchor="middle">1 s</text>
