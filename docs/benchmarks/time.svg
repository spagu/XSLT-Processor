<svg xmlns="http://www.w3.org/2000/svg" width="720" height="496" viewBox="0 0 720 496" role="img" aria-labelledby="t d">
<title id="t">Median time per scenario, 1.1.3 and 1.2.0 (log scale)</title>
<desc id="d">Median wall time of each scenario for both versions; the slowest is 100 MB text result, string (7.14 s on 1.1.3).</desc>
<style>
svg{--surface:#ffffff;--text:#1f2937;--muted:#5f6368;--grid:#e8eaed;--axis:#bdc1c6;--new:#2a78d6;--old:#eb6834;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px}
@media (prefers-color-scheme:dark){svg{--surface:#202124;--text:#e8eaed;--muted:#9aa0a6;--grid:#3c4043;--axis:#5f6368;--new:#3987e5;--old:#d95926}}
.bg{fill:var(--surface)}.t1{fill:var(--text)}.t2{fill:var(--muted)}
.title{fill:var(--text);font-size:13px;font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.link{stroke:var(--axis);stroke-width:2}
.new{fill:var(--new)}.old{fill:var(--old)}
.ring{stroke:var(--surface);stroke-width:2}
</style>
<rect class="bg" width="720" height="496" rx="8"/>
<text class="title" x="16" y="24">Median time per scenario, 1.1.3 and 1.2.0 (log scale)</text>
<circle class="old" cx="255" cy="46" r="5"/>
<text class="t1" x="265" y="50" text-anchor="start">1.1.3</text>
<circle class="new" cx="327" cy="46" r="5"/>
<text class="t1" x="337" y="50" text-anchor="start">1.2.0</text>
<line class="grid" x1="250" x2="250" y1="78" y2="470"/>
<text class="t2" x="250" y="486" text-anchor="middle">10 ms</text>
<line class="grid" x1="383.3" x2="383.3" y1="78" y2="470"/>
<text class="t2" x="383.3" y="486" text-anchor="middle">100 ms</text>
<line class="grid" x1="516.7" x2="516.7" y1="78" y2="470"/>
<text class="t2" x="516.7" y="486" text-anchor="middle">1 s</text>
<line class="grid" x1="650" x2="650" y1="78" y2="470"/>
<text class="t2" x="650" y="486" text-anchor="middle">10 s</text>
<text class="t1" x="234" y="96" text-anchor="end">100 MB text result, string</text>
<line class="link" x1="630.5" x2="596" y1="92" y2="92"/>
<circle class="old ring" cx="630.5" cy="92" r="5"><title>100 MB text result, string, 1.1.3: median 7.14 s</title></circle>
<circle class="new ring" cx="596" cy="92" r="5"><title>100 MB text result, string, 1.2.0: median 3.94 s</title></circle>
<text class="t2" x="596" y="82" text-anchor="end">1.2.0</text>
<text class="t2" x="630.5" y="82" text-anchor="start">1.1.3</text>
<text class="t1" x="234" y="124" text-anchor="end">CLI end to end, jsdom</text>
<line class="link" x1="608.2" x2="592.4" y1="120" y2="120"/>
<circle class="old ring" cx="608.2" cy="120" r="5"><title>CLI end to end, jsdom, 1.1.3: median 4.86 s</title></circle>
<circle class="new ring" cx="592.4" cy="120" r="5"><title>CLI end to end, jsdom, 1.2.0: median 3.70 s</title></circle>
<text class="t1" x="234" y="152" text-anchor="end">100 MB text result, stream</text>
<circle class="new ring" cx="595.3" cy="148" r="5"><title>100 MB text result, stream, 1.2.0: median 3.89 s</title></circle>
<text class="t1" x="234" y="180" text-anchor="end">Issue #9 catalogue (3 MB HTML)</text>
<line class="link" x1="592.9" x2="576.8" y1="176" y2="176"/>
<circle class="old ring" cx="592.9" cy="176" r="5"><title>Issue #9 catalogue (3 MB HTML), 1.1.3: median 3.73 s</title></circle>
<circle class="new ring" cx="576.8" cy="176" r="5"><title>Issue #9 catalogue (3 MB HTML), 1.2.0: median 2.83 s</title></circle>
<text class="t1" x="234" y="208" text-anchor="end">Identity transform, 5 MB</text>
<line class="link" x1="577.9" x2="560.4" y1="204" y2="204"/>
<circle class="old ring" cx="577.9" cy="204" r="5"><title>Identity transform, 5 MB, 1.1.3: median 2.88 s</title></circle>
<circle class="new ring" cx="560.4" cy="204" r="5"><title>Identity transform, 5 MB, 1.2.0: median 2.13 s</title></circle>
<text class="t1" x="234" y="236" text-anchor="end">CLI end to end, XSLT_DOM=xmldom</text>
<circle class="new ring" cx="537" cy="232" r="5"><title>CLI end to end, XSLT_DOM=xmldom, 1.2.0: median 1.42 s</title></circle>
<text class="t1" x="234" y="264" text-anchor="end">Sort 20,000 by two keys</text>
<line class="link" x1="481.8" x2="464.7" y1="260" y2="260"/>
<circle class="old ring" cx="481.8" cy="260" r="5"><title>Sort 20,000 by two keys, 1.1.3: median 548 ms</title></circle>
<circle class="new ring" cx="464.7" cy="260" r="5"><title>Sort 20,000 by two keys, 1.2.0: median 407 ms</title></circle>
<text class="t1" x="234" y="292" text-anchor="end">apply-templates item[@id], 8,000</text>
<line class="link" x1="434.1" x2="416.8" y1="288" y2="288"/>
<circle class="old ring" cx="434.1" cy="288" r="5"><title>apply-templates item[@id], 8,000, 1.1.3: median 240 ms</title></circle>
<circle class="new ring" cx="416.8" cy="288" r="5"><title>apply-templates item[@id], 8,000, 1.2.0: median 178 ms</title></circle>
<text class="t1" x="234" y="320" text-anchor="end">following-sibling::x[1], 8,000</text>
<line class="link" x1="413.5" x2="390.2" y1="316" y2="316"/>
<circle class="old ring" cx="413.5" cy="316" r="5"><title>following-sibling::x[1], 8,000, 1.1.3: median 168 ms</title></circle>
<circle class="new ring" cx="390.2" cy="316" r="5"><title>following-sibling::x[1], 8,000, 1.2.0: median 113 ms</title></circle>
<text class="t1" x="234" y="348" text-anchor="end">Muenchian grouping, 8,000</text>
<line class="link" x1="409.3" x2="404.5" y1="344" y2="344"/>
<circle class="old ring" cx="409.3" cy="344" r="5"><title>Muenchian grouping, 8,000, 1.1.3: median 157 ms</title></circle>
<circle class="new ring" cx="404.5" cy="344" r="5"><title>Muenchian grouping, 8,000, 1.2.0: median 144 ms</title></circle>
<text class="t1" x="234" y="376" text-anchor="end">xsl:number level=&quot;any&quot;, 8,000</text>
<line class="link" x1="407.9" x2="381" y1="372" y2="372"/>
<circle class="old ring" cx="407.9" cy="372" r="5"><title>xsl:number level=&quot;any&quot;, 8,000, 1.1.3: median 153 ms</title></circle>
<circle class="new ring" cx="381" cy="372" r="5"><title>xsl:number level=&quot;any&quot;, 8,000, 1.2.0: median 96 ms</title></circle>
<text class="t1" x="234" y="404" text-anchor="end">call-template depth 3,000</text>
<circle class="new ring" cx="355.8" cy="400" r="5"><title>call-template depth 3,000, 1.2.0: median 62 ms</title></circle>
<text class="t2" x="365.8" y="404" text-anchor="start">1.1.3: error</text>
<text class="t1" x="234" y="432" text-anchor="end">call-template depth 900</text>
<line class="link" x1="316.2" x2="300.8" y1="428" y2="428"/>
<circle class="old ring" cx="316.2" cy="428" r="5"><title>call-template depth 900, 1.1.3: median 31 ms</title></circle>
<circle class="new ring" cx="300.8" cy="428" r="5"><title>call-template depth 900, 1.2.0: median 24 ms</title></circle>
<text class="t1" x="234" y="460" text-anchor="end">Standalone binary start-up</text>
<circle class="new ring" cx="309.4" cy="456" r="5"><title>Standalone binary start-up, 1.2.0: median 28 ms</title></circle>
</svg>
