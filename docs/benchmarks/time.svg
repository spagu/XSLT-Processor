<circle class="new ring" cx="595.7" cy="92" r="5"><title>100 MB text result, string, 1.2.0: median 3.91 s</title></circle>
<text class="t2" x="595.7" y="82" text-anchor="end">1.2.0</text>
<text class="t2" x="629.8" y="82" text-anchor="start">1.1.3</text>
