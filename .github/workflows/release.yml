name: Release

# Runs once per GitHub release (creating a release also pushes its tag, so
# triggering on both events ran every job twice, including npm publish).
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x, 24.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm test

  build:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build distribution
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkgVersion="$(node -p "require('./package.json').version")"
          tagVersion="${GITHUB_REF_NAME#v}"
          if [ "$pkgVersion" != "$tagVersion" ]; then
            echo "package.json version ($pkgVersion) does not match tag ($tagVersion)" >&2
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 30

  # Publishes to npm via Trusted Publishing (OIDC). No NPM_TOKEN and no OTP are
  # needed: npm exchanges the GitHub-issued identity token for a short-lived
  # publish credential and attaches provenance automatically.
  #
  # One-time setup on npmjs.com (package settings -> Trusted Publisher):
  #   Provider:  GitHub Actions
  #   Owner:     spagu
  #   Repo:      XSLT-Processor
  #   Workflow:  release.yml
  #   Env:       (leave empty)
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build distribution
        run: npm run build

      # Trusted Publishing only (npm 11.5.1+, bundled with Node.js 26): npm
      # stops accepting 2FA-bypass tokens for publishing around January 2027
      # (https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/).
      - name: Publish to npm
        run: npm publish --provenance --access public

  # Standalone `xslt` executables (Node.js Single Executable Applications,
  # see scripts/binaries/build.mjs). Each target is built on its own OS and
  # CPU: the V8 code cache is platform specific and macOS binaries must be
  # signed (ad hoc) on a Mac. Every binary is smoke-tested natively with an
  # empty PATH: --version, an xsl:include transform of an ISO-8859-1 input
  # and an ISO-8859-1 result file.
  binaries:
    name: Binary (${{ matrix.target }})
    needs: [test]
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    # bash on every runner, Windows included (Git Bash), so "$VAR" works.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            binary: xslt-linux-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            binary: xslt-linux-arm64
          - target: darwin-x64
            runner: macos-15-intel
            binary: xslt-darwin-x64
          - target: darwin-arm64
            runner: macos-latest
            binary: xslt-darwin-arm64
          - target: windows-x64
            runner: windows-latest
            binary: xslt-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test the binary build scripts
        run: node --test "scripts/binaries/*.test.mjs"

      - name: Build the ${{ matrix.target }} binary
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/binaries/build.mjs --target "$TARGET"

      - name: Smoke test the binary
        env:
          BINARY: dist-bin/${{ matrix.binary }}
        run: node scripts/binaries/smoke.mjs "$BINARY"

      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist-bin/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30

  # Attaches the binaries and checksums.sha256 to the published GitHub
  # release. Only this job may write to the repository contents.
  release-binaries:
    needs: [build, binaries]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"

      - name: Download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist-bin
          merge-multiple: true

      - name: Write and verify checksums.sha256
        run: |
          node scripts/binaries/build.mjs checksums --out dist-bin
          cd dist-bin
          sha256sum --check checksums.sha256
          test "$(wc -l < checksums.sha256)" -eq 5

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist-bin/xslt-* dist-bin/checksums.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
