name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x, 24.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm test

  build:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build distribution
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkgVersion="$(node -p "require('./package.json').version")"
          tagVersion="${GITHUB_REF_NAME#v}"
          if [ "$pkgVersion" != "$tagVersion" ]; then
            echo "package.json version ($pkgVersion) does not match tag ($tagVersion)" >&2
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 30

  # Publishes to npm via Trusted Publishing (OIDC). No NPM_TOKEN and no OTP are
  # needed: npm exchanges the GitHub-issued identity token for a short-lived
  # publish credential and attaches provenance automatically.
  #
  # One-time setup on npmjs.com (package settings -> Trusted Publisher):
  #   Provider:  GitHub Actions
  #   Owner:     spagu
  #   Repo:      XSLT-Processor
  #   Workflow:  release.yml
  #   Env:       (leave empty)
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build distribution
        run: npm run build

      # NPM_TOKEN (granular access token with publish rights, 2FA bypass) is
      # used when present; otherwise npm falls back to Trusted Publishing (OIDC).
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
