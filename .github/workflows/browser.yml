name: Browser tests

# Playwright tests of the built bundles in Chromium, Firefox and WebKit
# (tests/browser). The native-vs-library differential test is informational:
# its summary table is printed in the job log and never fails the run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  browser:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install ${{ matrix.browser }} and its system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build distribution
        run: npm run build

      - name: Run browser tests
        run: npm run test:browser -- --project=${{ matrix.browser }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results-${{ matrix.browser }}
          path: test-results/browser
          retention-days: 7
