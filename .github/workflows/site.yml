# Project website: README.md, CHANGELOG.md and docs/*.md built with spagu/ssg
# (site/ssg.yaml) and deployed to Cloudflare Pages (wrangler.toml) at
# https://xslt-processor.tradik.com/. Repository secrets required:
# CLOUDFLARE_API_TOKEN (permission: Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/browser/check.spec.mjs"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "src/**"
      - "packages/xslt3/src/**"
      - "packages/migrate-check/**"
      - "scripts/build.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site.yml"
  # Pull requests build and check the site without deploying it
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "tests/browser/check.spec.mjs"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "src/**"
      - "packages/xslt3/src/**"
      - "packages/migrate-check/**"
      - "scripts/build.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned ssg release and the SHA-256 of its linux-amd64 archive, taken from
  # the release's checksums.sha256. Update both together.
  SSG_VERSION: "1.8.64"
  SSG_SHA256: "dfc0a414b53d31984462533a95097ed1eb5815a4b024384cb418ff4acfa2f689"
  # Wrangler release used for the deployment; keep in sync with the Makefile.
  WRANGLER_VERSION: "4.144.0"

# Nothing by default; each job asks for what it needs.
permissions: {}

# One deployment at a time; a queued run replaces an older queued one, but a
# deployment in progress is allowed to finish.
concurrency:
  group: site-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install ssg
        run: |
          set -euo pipefail
          archive="ssg-linux-amd64.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail -sSL \
            "https://github.com/spagu/ssg/releases/download/v${SSG_VERSION}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          echo "${SSG_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" ssg
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 "${RUNNER_TEMP}/ssg" "${RUNNER_TEMP}/bin/ssg"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test site scripts
        run: npm run test:site

      - name: Check documentation links
        run: npm run docs:check

      - name: Build bundles and site content
        run: |
          npm run build
          npm run site:content

      - name: Build site
        working-directory: site
        run: ssg --config ssg.yaml

      - name: Check site
        run: node site/scripts/check-site.mjs site/public

      # The online check (/check/) in a real browser: drops files and a zip on
      # the built page; needs the site, so it runs here and not in browser.yml
      - name: Install Chromium for the online check test
        run: npx playwright install --with-deps chromium

      - name: Test the online check in Chromium
        run: npx playwright test -c tests/browser/playwright.config.mjs --project=chromium tests/browser/check.spec.mjs

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/public
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: https://xslt-processor.tradik.com/
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site/public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          # From the build output: wrangler builds the Pages Functions it
          # finds in ./functions (ssg copies the cookie-consent worker there)
          workingDirectory: site/public
          # Creates the Pages project on the first deployment, in the account
          # the secrets point at, so the deploy never depends on a project
          # made by hand in some other account. One line: the action runs every
          # line of preCommands as a separate shell command
          preCommands: npx wrangler pages project list | grep -q '\bxslt-processor\b' || npx wrangler pages project create xslt-processor --production-branch=main
          command: pages deploy . --project-name=xslt-processor --branch=main

  # The site used to live at https://spagu.github.io/XSLT-Processor/. GitHub
  # Pages keeps serving site/redirect/index.html there (also as 404.html, so
  # every old path is caught), which sends visitors to the same path on
  # xslt-processor.tradik.com. Needs Settings > Pages > Source = GitHub Actions.
  redirect-github-pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare redirect pages
        run: |
          mkdir -p "${RUNNER_TEMP}/redirect"
          cp site/redirect/index.html "${RUNNER_TEMP}/redirect/index.html"
          cp site/redirect/index.html "${RUNNER_TEMP}/redirect/404.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/redirect

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
