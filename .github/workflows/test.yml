name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x, 24.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check documentation links
        run: npm run docs:check

      - name: Test binary build scripts
        if: matrix.node-version == '26.x'
        run: npm run test:binaries

      - name: Run tests with coverage
        run: npm test

      - name: Run @tradik/xslt3 tests with coverage
        run: npm run test:xslt3

      - name: Run xslt-migrate-check tests with coverage
        run: npm run test:migrate-check

      - name: W3C suite runner unit tests
        run: npm run test:suites:unit

      - name: Build distribution
        run: npm run build

  dom-matrix:
    # Test suites and conformance run against jsdom and @xmldom/xmldom
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run the DOM test matrix
        run: npm run test:dom

  binary-scripts:
    # The standalone-binary scripts run on every release OS: the release
    # workflow builds each binary natively, and a test that only fails on
    # macOS (/var -> /private/var) or Windows (tar, drive letters) would
    # otherwise surface only after a release is published.
    name: binary scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test the binary build scripts
        run: node --test "scripts/binaries/*.test.mjs"

  xslt3-suites:
    # @tradik/xslt3 against the W3C suites (qt3tests, xslt30-test), compared
    # with the committed baselines: a test that passed and now fails breaks
    # the build. The suites (about 100 MB) are cached per pinned commit.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache the W3C suites
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/xslt3-suites
          key: xslt3-suites-${{ hashFiles('packages/xslt3/test-suites/constants.mjs') }}

      - name: Fetch the W3C suites
        run: npm run suites:fetch

      - name: qt3tests, parse stage
        run: npm run test:qt3:parse

      - name: qt3tests, XPath 3.1 evaluation
        run: npm run test:qt3

      - name: xslt30-test, XSLT 3.0 and 2.0
        run: npm run test:xslt30

  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and test with Docker
        run: docker compose run --rm test
