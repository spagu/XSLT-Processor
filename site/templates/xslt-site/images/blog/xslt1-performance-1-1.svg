<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="t d">
<title id="t">Time per transformation before and after the 1.1 fixes</title>
<desc id="d">Dumbbell chart on a log scale of seconds, before (1.0.x) and after (1.1.x): xsl:number level any 105 s to 0.09 s; apply-templates with a predicate pattern 90 s to 0.1 s; issue 9 catalogue 28 s to 8 s; Muenchian grouping 8.5 s to 0.3 s; key lookups 7 s to 0.2 s; xsl:number level single 5.5 s to 0.1 s; following-sibling first match in a loop 4.7 s to 0.09 s.</desc>
<style>
svg{--surface:#ffffff;--text:#1f2937;--muted:#5f6368;--grid:#e8eaed;--axis:#bdc1c6;--new:#2a78d6;--old:#eb6834;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px}
@media (prefers-color-scheme:dark){svg{--surface:#202124;--text:#e8eaed;--muted:#9aa0a6;--grid:#3c4043;--axis:#5f6368;--new:#3987e5;--old:#d95926}}
.bg{fill:var(--surface)}.t1{fill:var(--text)}.t2{fill:var(--muted)}
.title{fill:var(--text);font-size:13px;font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}.link{stroke:var(--axis);stroke-width:2}
.new{fill:var(--new)}.old{fill:var(--old)}.ring{stroke:var(--surface);stroke-width:2}
</style>
<rect class="bg" width="720" height="364" rx="8"/>
<text class="title" x="16" y="24">Time per transformation before and after the 1.1 fixes (log scale)</text>
<text class="t2" x="16" y="44">Seconds; the same stylesheets and inputs, @tradik/xslt-processor 1.0.x and 1.1.2–1.1.3</text>
<circle class="old ring" cx="312" cy="62" r="5"/><text class="t1" x="322" y="66">before (1.0.x)</text><circle class="new ring" cx="442" cy="62" r="5"/><text class="t1" x="452" y="66">after (1.1.x)</text>
<line class="grid" x1="376.3" x2="376.3" y1="80" y2="324"/><text class="t2" x="376.3" y="340" text-anchor="middle">0.1 s</text>
<line class="grid" x1="468.3" x2="468.3" y1="80" y2="324"/><text class="t2" x="468.3" y="340" text-anchor="middle">1 s</text>
<line class="grid" x1="560.3" x2="560.3" y1="80" y2="324"/><text class="t2" x="560.3" y="340" text-anchor="middle">10 s</text>
<line class="grid" x1="652.3" x2="652.3" y1="80" y2="324"/><text class="t2" x="652.3" y="340" text-anchor="middle">100 s</text>
<text class="t1" x="256" y="107.0" text-anchor="end">xsl:number level=&quot;any&quot;, 8,000 nodes</text>
<line class="link" x1="372.1" x2="654.3" y1="103.0" y2="103.0"/>
<circle class="old ring" cx="654.3" cy="103.0" r="6"><title>xsl:number level=&quot;any&quot;, 8,000 nodes: 105 s before</title></circle>
<circle class="new ring" cx="372.1" cy="103.0" r="6"><title>xsl:number level=&quot;any&quot;, 8,000 nodes: 0.09 s after</title></circle>
<text class="t2" x="664.3" y="107.0">105 s</text>
<text class="t2" x="362.1" y="107.0" text-anchor="end">0.09 s</text>
<text class="t1" x="256" y="141.0" text-anchor="end">apply-templates match=&quot;item[@id]&quot;</text>
<line class="link" x1="376.3" x2="648.1" y1="137.0" y2="137.0"/>
<circle class="old ring" cx="648.1" cy="137.0" r="6"><title>apply-templates match=&quot;item[@id]&quot;: 90 s before</title></circle>
<circle class="new ring" cx="376.3" cy="137.0" r="6"><title>apply-templates match=&quot;item[@id]&quot;: 0.1 s after</title></circle>
<text class="t2" x="658.1" y="141.0">90 s</text>
<text class="t2" x="366.3" y="141.0" text-anchor="end">0.1 s</text>
<text class="t1" x="256" y="175.0" text-anchor="end">Issue #9 catalogue, 3.4 MB HTML</text>
<line class="link" x1="551.4" x2="601.4" y1="171.0" y2="171.0"/>
<circle class="old ring" cx="601.4" cy="171.0" r="6"><title>Issue #9 catalogue, 3.4 MB HTML: 28 s before</title></circle>
<circle class="new ring" cx="551.4" cy="171.0" r="6"><title>Issue #9 catalogue, 3.4 MB HTML: 8 s after</title></circle>
<text class="t2" x="611.4" y="175.0">28 s</text>
<text class="t2" x="541.4" y="175.0" text-anchor="end">8 s</text>
<text class="t1" x="256" y="209.0" text-anchor="end">Muenchian grouping, 8,000 items</text>
<line class="link" x1="420.2" x2="553.8" y1="205.0" y2="205.0"/>
<circle class="old ring" cx="553.8" cy="205.0" r="6"><title>Muenchian grouping, 8,000 items: 8.5 s before</title></circle>
<circle class="new ring" cx="420.2" cy="205.0" r="6"><title>Muenchian grouping, 8,000 items: 0.3 s after</title></circle>
<text class="t2" x="563.8" y="209.0">8.5 s</text>
<text class="t2" x="410.2" y="209.0" text-anchor="end">0.3 s</text>
<text class="t1" x="256" y="243.0" text-anchor="end">key() lookups</text>
<line class="link" x1="404.0" x2="546.1" y1="239.0" y2="239.0"/>
<circle class="old ring" cx="546.1" cy="239.0" r="6"><title>key() lookups: 7 s before</title></circle>
<circle class="new ring" cx="404.0" cy="239.0" r="6"><title>key() lookups: 0.2 s after</title></circle>
<text class="t2" x="556.1" y="243.0">7 s</text>
<text class="t2" x="394.0" y="243.0" text-anchor="end">0.2 s</text>
<text class="t1" x="256" y="277.0" text-anchor="end">xsl:number level=&quot;single&quot;</text>
<line class="link" x1="376.3" x2="536.4" y1="273.0" y2="273.0"/>
<circle class="old ring" cx="536.4" cy="273.0" r="6"><title>xsl:number level=&quot;single&quot;: 5.5 s before</title></circle>
<circle class="new ring" cx="376.3" cy="273.0" r="6"><title>xsl:number level=&quot;single&quot;: 0.1 s after</title></circle>
<text class="t2" x="546.4" y="277.0">5.5 s</text>
<text class="t2" x="366.3" y="277.0" text-anchor="end">0.1 s</text>
<text class="t1" x="256" y="311.0" text-anchor="end">following-sibling::x[1], 8,000</text>
<line class="link" x1="372.1" x2="530.1" y1="307.0" y2="307.0"/>
<circle class="old ring" cx="530.1" cy="307.0" r="6"><title>following-sibling::x[1], 8,000: 4.7 s before</title></circle>
<circle class="new ring" cx="372.1" cy="307.0" r="6"><title>following-sibling::x[1], 8,000: 0.09 s after</title></circle>
<text class="t2" x="540.1" y="311.0">4.7 s</text>
<text class="t2" x="362.1" y="311.0" text-anchor="end">0.09 s</text>
</svg>
