<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>polyfill entry</title>
<script type="module">
  // What a bundled app does: import the entry once, then use the W3C API
  import "/dist/polyfill.js";
  const parse = (text) => new DOMParser().parseFromString(text, "application/xml");
  const processor = new XSLTProcessor();
  processor.importStylesheet(parse(`<xsl:stylesheet version="1.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform">
    <xsl:template match="/"><p id="out"><xsl:value-of select="count(//i)"/></p></xsl:template>
  </xsl:stylesheet>`));
  document.body.appendChild(processor.transformToFragment(parse("<r><i/><i/></r>"), document));
  window.ready = true;
</script>
</head>
<body></body>
</html>
